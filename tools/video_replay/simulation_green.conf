# Host simulation experiment only; not an OS04A10 hardware profile.
# MuJoCo vertical fovy=70 degrees, 640x480 square pixels, no distortion.
# fx=fy=480/(2*tan(35 degrees)); pixel centers start at (0,0).
camera.width=640
camera.height=480
camera.fps=10
camera.warmup_frames=0
calibration.fx=342.7555216
calibration.fy=342.7555216
calibration.principal_x=319.5
calibration.principal_y=239.5
calibration.k1=0
calibration.k2=0
calibration.p1=0
calibration.p2=0
calibration.k3=0

# Existing normalized RGB candidate/confirmation implementation and scores.
performance.classical_interval_frames=1
performance.legacy_lab_candidates_enabled=false
performance.sparse_component_search_enabled=true
performance.integral_peak_statistics=true
performance.multiscale_downsample=1
performance.multiscale_capture_cone_only=true
performance.multiscale_tracking_roi_radius_px=72
performance.multiscale_full_refresh_interval=30
multiscale.enabled=true
multiscale.diameters_px=2,4,6,9,14
capture.enabled=true
capture.cone_deg=35
tracking.confirm_window=5
tracking.confirm_hits=3

# Preserve actual per-frame detection at 10 Hz. No inferred physical exposure,
# calibrated image covariance or motion prior is invented for this experiment.
visual_motion.enabled=false
npu.enabled=false
npu.required=false
target_geometry.pose_enabled=false
armor.expected_color=auto
debug.enabled=false
